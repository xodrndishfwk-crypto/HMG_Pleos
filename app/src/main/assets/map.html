<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="maplibre-gl.css" />
  <script>
    const sessionId = Number(new URLSearchParams(location.search).get('session') || 0);
    function reportMapError(fatal) {
      if (window.Android) Android.onMapError(sessionId, fatal);
    }
    window.addEventListener('error', () => reportMapError(true));
    window.addEventListener('unhandledrejection', () => reportMapError(true));
  </script>
  <script src="maplibre-gl.js"></script>
  <style>
    html,body,#map { width:100%; height:100%; margin:0; overflow:hidden; background:#8bc9ee; }
    .maplibregl-ctrl-bottom-right { bottom: calc(var(--overlay-inset, 140px) + 8px); }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [127.027619, 37.497952],
    zoom: 17.7,
    pitch: 76,
    bearing: 78,
    maxPitch: 85,
    attributionControl: true,
    antialias: true
  });

  map.on('error', () => reportMapError(!map.isStyleLoaded()));
  map.on('webglcontextlost', () => reportMapError(true));

  function setOverlayInset(pixels) {
    if (Number.isFinite(pixels) && pixels >= 0) {
      document.documentElement.style.setProperty('--overlay-inset', pixels + 'px');
    }
  }

  map.on('load', () => {
    map.getStyle().layers
      .filter(layer => layer.type === 'fill-extrusion')
      .forEach(layer => map.setLayoutProperty(layer.id, 'visibility', 'none'));
    map.setSky({
      'sky-color': '#68b9ed',
      'horizon-color': '#f4fbff',
      'fog-color': '#d8edf7',
      'sky-horizon-blend': 0.42,
      'horizon-fog-blend': 0.55,
      'fog-ground-blend': 0.65
    });
    if (window.Android) Android.onMapReady(sessionId);
  });

  function showRoute(payload) {
    const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
    const geojson = {
      type: 'Feature', properties: {},
      geometry: { type: 'LineString', coordinates: data.coordinates }
    };
    if (map.getSource('route')) {
      map.getSource('route').setData(geojson);
    } else {
      map.addSource('route', { type:'geojson', data:geojson, lineMetrics:true });
      map.addLayer({
        id:'route-shadow', type:'line', source:'route',
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#102348','line-width':25,'line-opacity':0.62}
      });
      map.addLayer({
        id:'route-glow', type:'line', source:'route',
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#3ea1ff','line-width':20,'line-blur':5,'line-opacity':0.65}
      });
      map.addLayer({
        id:'route-main', type:'line', source:'route',
        layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#087dff','line-width':13,'line-opacity':1}
      });
    }
    map.easeTo({
      center: data.lookAhead,
      zoom: 17.7,
      pitch: 76,
      bearing: data.bearing,
      padding: {top:0,right:0,bottom:150,left:0},
      duration: 1000
    });
  }
  let lastRenderSeq = -1;
  let renderedRouteId = null;
  let vehicleMarker = null;
  window.starlog = { receive(payload) {
    const e = typeof payload === 'string' ? JSON.parse(payload) : payload;
    if (e.version !== 1 || e.type !== 'renderState' || !Number.isSafeInteger(e.seq)) throw Error('CONTRACT_VERSION_MISMATCH');
    if (e.seq <= lastRenderSeq) return;
    const p = e.payload;
    if (p.route && p.route.routeId !== renderedRouteId) {
      const coordinates = p.route.coordinates;
      showRoute({coordinates, lookAhead: coordinates[0], bearing: map.getBearing()});
      renderedRouteId = p.route.routeId;
    }
    if (p.pose) {
      if (!vehicleMarker) {
        const el = document.createElement('div');
        el.textContent = '▲'; el.style.cssText = 'color:#087dff;font-size:38px;text-shadow:0 0 4px white';
        vehicleMarker = new maplibregl.Marker({element:el, rotationAlignment:'map'});
      }
      vehicleMarker.getElement().textContent = p.pose.headingDeg === null ? '●' : '▲';
      vehicleMarker.getElement().style.opacity = p.pose.quality === 'VALID' ? '1' : '0.45';
      vehicleMarker.setLngLat(p.pose.coordinate).setRotation(p.pose.headingDeg ?? 0).addTo(map);
      const heading = p.pose.headingDeg ?? map.getBearing();
      const rad = Math.PI / 180, lat = p.pose.coordinate[1] * rad, lon = p.pose.coordinate[0] * rad;
      const d = p.camera.lookAheadM / 6371008.8, bearing = heading * rad;
      const aheadLat = Math.asin(Math.sin(lat)*Math.cos(d)+Math.cos(lat)*Math.sin(d)*Math.cos(bearing));
      const aheadLon = lon + Math.atan2(Math.sin(bearing)*Math.sin(d)*Math.cos(lat), Math.cos(d)-Math.sin(lat)*Math.sin(aheadLat));
      map.easeTo({center:[aheadLon/rad,aheadLat/rad], bearing:heading,
        pitch:p.camera.pitchDeg, zoom:p.camera.zoom, padding:{top:0,right:0,bottom:150,left:0}, duration:300});
    } else if (vehicleMarker) { vehicleMarker.remove(); vehicleMarker = null; }
    lastRenderSeq = e.seq;
    window.starlog.lastState = e;
  }};
</script>
</body>
</html>
